<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liora Beauty</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #ffffff;
      color: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      margin-top: 80px;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 16px;
      color: #555;
      margin-bottom: 40px;
    }

    .btn-primary {
      display: inline-block;
      background: #000;
      color: #fff;
      text-decoration: none;
      padding: 14px 34px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 500;
      transition: background 0.2s ease;
    }

    .btn-primary:hover {
      background: #222;
    }

    .banner {
      margin-top: 60px;
      padding: 14px 20px;
      background: #f5f5f5;
      color: #444;
      font-size: 14px;
      border-radius: 6px;
    }

    footer {
      margin-top: auto;
      padding: 30px 0;
      font-size: 13px;
      color: #777;
    }

    footer a {
      color: #777;
      text-decoration: none;
      margin-left: 10px;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <header>
    <h1>Liora Beauty</h1>
    <div class="subtitle">Des soins élégants. Une beauté naturelle.</div>

    <a
      href="https://buy.stripe.com/9B6dR9bjN6kue1t08d9fW00"
      class="btn-primary"
      target="_blank"
      rel="noopener noreferrer"
    >
      Payer
    </a>
  </header>

  <div class="banner">
    Paiement sécurisé via Stripe · Livraison rapide · Service client réactif
  </div>

  <footer>
    © <span id="year"></span> Liora Beauty
    · <a href="mentions.html">Mentions légales</a>
    · <a href="contact.html">Contact</a>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>
</html>
